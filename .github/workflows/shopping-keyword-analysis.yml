# 매일 한 번, 등록된 모든 쇼핑 키워드의 네이버쇼핑 노출 상품 목록을 조회해서 Supabase에
# 스냅샷으로 기록합니다(place-rank-check.yml과 동일한 방식).
#
# 웹 화면의 "지금 분석하기" 버튼을 누르면 shopping_keyword_id 입력값과 함께 이 워크플로가
# workflow_dispatch로 수동 실행돼서, 그 키워드 하나만 바로 분석합니다.
# (shopping_keyword_id를 안 넘기면 = 매일 새벽 스케줄과 동일하게 등록된 전체 키워드를 분석합니다.)
#
# 사용 전 준비(place-rank-check.yml과 동일한 Secrets를 그대로 씁니다):
#  1. 저장소 Settings → Secrets and variables → Actions 에 SUPABASE_URL,
#     SUPABASE_SERVICE_ROLE_KEY가 이미 등록되어 있어야 합니다.
#  2. Vercel에 GITHUB_TOKEN, GITHUB_REPO가 등록되어 있어야 "지금 분석하기" 버튼이 동작합니다.
name: shopping-keyword-analysis

on:
  schedule:
    # 매일 22:00 UTC = 한국시간(KST) 오전 7시. place-rank-check(오전 6시)와 겹치지 않도록
    # 1시간 뒤로 뒀습니다 — 필요에 맞게 조정하세요.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      shopping_keyword_id:
        description: "이 값을 채우면 해당 키워드 하나만, 비워두면 등록된 전체 키워드를 분석합니다."
        required: false
        type: string
      request_id:
        description: "웹 화면의 '지금 분석하기'가 자동으로 채우는 값이에요. 수동 실행할 때는 비워두면 됩니다."
        required: false
        type: string

jobs:
  analyze-shopping-keywords:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 의존성 캐시 확인
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: 의존성 설치 (캐시 없을 때만)
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm install

      - name: Playwright 브라우저 캐시 확인
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Playwright 브라우저 설치 (캐시 없을 때만)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Playwright 시스템 라이브러리만 설치 (브라우저는 캐시에서 재사용)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: 필수 환경변수(Secrets) 확인
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e "
          for (const k of ['SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY']) {
            if (!process.env[k] || !process.env[k].trim()) {
              console.error('필수 환경변수가 없습니다: ' + k + ' — 저장소 Settings > Secrets and variables > Actions 에서 등록해주세요.');
              process.exit(1);
            }
          }
          console.log('필수 환경변수 확인 완료 (값 자체는 출력하지 않습니다).');
          "

      - name: 쇼핑 키워드 분석 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SHOPPING_KEYWORD_ID: ${{ github.event.inputs.shopping_keyword_id }}
          REQUEST_ID: ${{ github.event.inputs.request_id }}
        run: node scripts/run-shopping-keyword-analysis.js
