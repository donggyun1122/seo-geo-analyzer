# 매일 한 번, 등록된 모든 매장/키워드의 네이버 플레이스 순위를 측정해서 Supabase에 기록합니다.
# 헤드리스 브라우저(Playwright)가 필요해서 Vercel 서버리스 함수 대신 이 워크플로에서 실행합니다.
#
# 웹 화면의 "지금 측정하기" 버튼을 누르면 place_keyword_id 입력값과 함께 이 워크플로가
# API(workflow_dispatch)로 수동 실행돼서, 그 키워드 하나만 바로 측정합니다.
# (place_keyword_id를 안 넘기면 = 매일 새벽 스케줄과 동일하게 등록된 전체 키워드를 측정합니다.)
#
# 사용 전 준비:
#  1. GitHub 저장소 Settings → Secrets and variables → Actions 에서 아래 두 개를 등록하세요.
#     - SUPABASE_URL
#     - SUPABASE_SERVICE_ROLE_KEY  (anon key 아님 — service role key. 절대 클라이언트 코드에 넣지 마세요)
#  2. 저장소 Settings → Actions → General 에서 Actions 실행이 허용되어 있는지 확인하세요.
#  3. "지금 측정하기" 버튼을 쓰려면 Vercel에 GITHUB_TOKEN / GITHUB_REPO도 등록해야 해요.
#     (자세한 내용은 README.md의 "플레이스 순위 기능 — 설정 방법" 참고)
name: place-rank-check

on:
  schedule:
    # 매일 21:00 UTC = 한국시간(KST) 오전 6시. 필요에 맞게 조정하세요.
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      place_keyword_id:
        description: "이 값을 채우면 해당 키워드 하나만, 비워두면 등록된 전체 키워드를 측정합니다 (Actions 탭에서 수동 실행할 때는 보통 비워두면 됩니다)."
        required: false
        type: string
      request_id:
        description: "웹 화면의 '지금 측정하기'가 자동으로 채우는 값이에요. Actions 탭에서 수동 실행할 때는 비워두면 됩니다."
        required: false
        type: string

jobs:
  check-ranks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      # Node 22+ (WebSocket 기본 내장). @supabase/supabase-js가 내부적으로 realtime-js를
      # 초기화하면서 전역 WebSocket 지원 여부를 확인하는데, Node 20에는 이게 없어서
      # createClient() 호출 시점에 "Node.js 20 detected without native WebSocket support"
      # 오류로 바로 죽어요(우리는 realtime 기능을 쓰지도 않는데도 이 체크를 통과해야 해요).
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # package-lock.json이 없어도 되도록 package.json 해시로 캐시 키를 만들어요.
      # 캐시가 있으면 npm install / Playwright 브라우저 다운로드를 건너뛸 수 있어서
      # "지금 측정하기" 버튼을 눌렀을 때 체감 대기시간이 크게 줄어들어요.
      - name: 의존성 캐시 확인
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: 의존성 설치 (캐시 없을 때만)
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm install

      - name: Playwright 브라우저 캐시 확인
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Playwright 브라우저 설치 (캐시 없을 때만 — 처음 실행이라 가장 오래 걸리는 단계예요)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Playwright 시스템 라이브러리만 설치 (브라우저는 캐시에서 재사용)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Secrets가 하나라도 비어있으면 여기서 바로, 명확한 메시지로 실패시킵니다.
      # (값 자체는 절대 로그에 출력하지 않고 "있다/없다"만 확인합니다.)
      - name: 필수 환경변수(Secrets) 확인
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e "
          for (const k of ['SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY']) {
            if (!process.env[k] || !process.env[k].trim()) {
              console.error('필수 환경변수가 없습니다: ' + k + ' — 저장소 Settings > Secrets and variables > Actions 에서 등록해주세요.');
              process.exit(1);
            }
          }
          console.log('필수 환경변수 확인 완료 (값 자체는 출력하지 않습니다).');
          "

      - name: 순위 측정 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PLACE_KEYWORD_ID: ${{ github.event.inputs.place_keyword_id }}
          REQUEST_ID: ${{ github.event.inputs.request_id }}
        run: node scripts/run-place-rank-checks.js
