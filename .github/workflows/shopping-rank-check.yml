# "네이버 쇼핑 순위 체크" 화면에서 조회 버튼을 누르면 이 워크플로가 workflow_dispatch로
# 실행되어, 키워드 + 특정 상품이 광고/일반 영역 중 선택한 쪽에서 몇 위인지 조회해서
# Supabase에 기록합니다. 매일 자동 실행되는 배치가 아니라 조회할 때마다 그 자리에서
# 실행되는 온디맨드 워크플로예요(keyword-place-list.yml과 동일한 방식).
#
# 사용 전 준비 — 다른 기능들과 동일한 Secrets를 그대로 씁니다:
#  1. 저장소 Settings → Secrets and variables → Actions 에 SUPABASE_URL,
#     SUPABASE_SERVICE_ROLE_KEY가 이미 등록되어 있어야 합니다.
#  2. Vercel에 GITHUB_TOKEN, GITHUB_REPO가 등록되어 있어야 "조회하기" 버튼이 동작합니다.
name: shopping-rank-check

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "웹 화면이 자동으로 채우는 요청 ID예요. 수동 실행할 때는 아무 값이나 넣어도 됩니다."
        required: true
        type: string
      keyword:
        description: "검색 키워드 (예: 캐리어)"
        required: true
        type: string
      product_id_input:
        description: "상품 URL 또는 ID (예: 스마트스토어 상품 URL, 네이버쇼핑 카탈로그 URL, 또는 숫자 ID)"
        required: true
        type: string
      area_mode:
        description: "ad(광고 영역) 또는 organic(광고 제외 영역)"
        required: false
        type: string
        default: "organic"
      max_rank:
        description: "이 순위 안에서 못 찾으면 '순위 밖'으로 처리합니다"
        required: false
        type: string
        default: "200"

jobs:
  check-shopping-rank:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 의존성 캐시 확인
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: 의존성 설치 (캐시 없을 때만)
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm install

      - name: Playwright 브라우저 캐시 확인
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Playwright 브라우저 설치 (캐시 없을 때만)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Playwright 시스템 라이브러리만 설치 (브라우저는 캐시에서 재사용)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: 필수 환경변수(Secrets) 확인
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e "
          for (const k of ['SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY']) {
            if (!process.env[k] || !process.env[k].trim()) {
              console.error('필수 환경변수가 없습니다: ' + k + ' — 저장소 Settings > Secrets and variables > Actions 에서 등록해주세요.');
              process.exit(1);
            }
          }
          console.log('필수 환경변수 확인 완료 (값 자체는 출력하지 않습니다).');
          "

      - name: 쇼핑 순위 체크 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUEST_ID: ${{ github.event.inputs.request_id }}
          KEYWORD: ${{ github.event.inputs.keyword }}
          PRODUCT_ID_INPUT: ${{ github.event.inputs.product_id_input }}
          AREA_MODE: ${{ github.event.inputs.area_mode }}
          MAX_RANK: ${{ github.event.inputs.max_rank }}
        run: node scripts/run-shopping-rank-check.js
