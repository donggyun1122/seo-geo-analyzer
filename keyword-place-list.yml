# "키워드 분석" 화면에서 키워드를 검색하면 이 워크플로가 workflow_dispatch로 실행되어,
# 그 키워드로 노출되는 업체 목록(순위/이름/카테고리/주소)을 조회해서 Supabase에 기록합니다.
# 매일 자동 실행되는 배치가 아니라 검색할 때마다 그 자리에서 실행되는 온디맨드 워크플로예요.
#
# 사용 전 준비(place-rank-check.yml과 동일한 Secrets를 그대로 씁니다):
#  1. 저장소 Settings → Secrets and variables → Actions 에 SUPABASE_URL,
#     SUPABASE_SERVICE_ROLE_KEY가 이미 등록되어 있어야 합니다(플레이스 순위 기능을 먼저
#     설정했다면 이미 있을 거예요).
#  2. Vercel에 GITHUB_TOKEN, GITHUB_REPO가 등록되어 있어야 "키워드 분석하기" 버튼이
#     동작합니다(마찬가지로 플레이스 순위 기능과 공유).
name: keyword-place-list

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "웹 화면이 자동으로 채우는 요청 ID예요. Actions 탭에서 수동 실행할 때는 아무 값이나 넣어도 됩니다."
        required: true
        type: string
      keyword:
        description: "분석할 키워드 (예: 홍대맛집)"
        required: true
        type: string
      device:
        description: "mobile 또는 pc — 주소 정보는 mobile에서만 확인됩니다."
        required: false
        type: string
        default: "mobile"
      max_rank:
        description: "최대 조회 개수 (예: 50, 100, 200)"
        required: false
        type: string
        default: "50"

jobs:
  list-places:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 의존성 캐시 확인
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: 의존성 설치 (캐시 없을 때만)
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm install

      - name: Playwright 브라우저 캐시 확인
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Playwright 브라우저 설치 (캐시 없을 때만 — 처음 실행이라 가장 오래 걸리는 단계예요)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Playwright 시스템 라이브러리만 설치 (브라우저는 캐시에서 재사용)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: 필수 환경변수(Secrets) 확인
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e "
          for (const k of ['SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY']) {
            if (!process.env[k] || !process.env[k].trim()) {
              console.error('필수 환경변수가 없습니다: ' + k + ' — 저장소 Settings > Secrets and variables > Actions 에서 등록해주세요.');
              process.exit(1);
            }
          }
          console.log('필수 환경변수 확인 완료 (값 자체는 출력하지 않습니다).');
          "

      - name: 키워드 분석 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REQUEST_ID: ${{ github.event.inputs.request_id }}
          KEYWORD: ${{ github.event.inputs.keyword }}
          DEVICE: ${{ github.event.inputs.device }}
          MAX_RANK: ${{ github.event.inputs.max_rank }}
        run: node scripts/run-keyword-place-list.js
